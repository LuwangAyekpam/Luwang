
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8fafc" />
    <title>Luwang</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Inter, Arial, sans-serif;
        background: #f8fafc;
      }

      #root {
        min-height: 100vh;
      }

      .initial-loading {
        min-height: 100vh;
        min-height: 100dvh;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        background: linear-gradient(145deg, #f8fafc, #eef2ff);
      }

     .loading-content {
  width: 100%;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 14px;
  margin: 0 auto;
}

      .loading-logo {
        width: 68px;
        height: 68px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 20px;
        background: #ffffff;
        color: #4f46e5;
        font-size: 32px;
        font-weight: 700;
        box-shadow: 0 8px 24px rgba(79, 70, 229, 0.10);
      }

      .loading-title {
        margin: 4px 0 0;
        color: #1e293b;
        font-size: 30px;
        font-weight: 700;
        letter-spacing: -1px;
      }

      .loading-message {
        margin: 0;
        color: #64748b;
        font-size: 14px;
        line-height: 1.5;
      }

      .loading-spinner {
        width: 25px;
        height: 25px;
        margin-top: 12px;
        border: 3px solid #e0e7ff;
        border-top-color: #6366f1;
        border-radius: 50%;
        animation: loading-spin 0.8s linear infinite;
      }

      @keyframes loading-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .loading-spinner {
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div class="initial-loading">
        <div class="loading-content">
          <div class="loading-logo">L</div>
          <h1 class="loading-title">Luwang</h1>
          <p class="loading-message">
            Your personal space is getting ready.
          </p>
          <div class="loading-spinner"></div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
